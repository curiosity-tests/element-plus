name: 🧪 Unit Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "🧪 Unit Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    name: Unit Test (${{ matrix.node-name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24, 26]
        include:
          - node-version: 22.13.0
            node-name: LTS
          - node-version: 24
            node-name: LTS(24)
          - node-version: 26
            node-name: Current
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Test
        run: pnpm test
